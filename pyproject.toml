[project]
name = "adzuki-gwas-analysis"
version = "0.1.0"
description = "Input contract and validation infrastructure for public adzuki bean GWAS summary statistics"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
adzuki-gwas-validate = "adzuki_gwas_analysis.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adzuki_gwas_analysis"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["adzuki_gwas_analysis"]
mypy_path = "src"
